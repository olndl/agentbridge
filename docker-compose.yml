services:
  backend:
    build:
      context: ./backend
    environment:
      AGENTBRIDGE_DB: /app/data/agentbridge.db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - agentbridge-data:/app/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  agentbridge-data:
